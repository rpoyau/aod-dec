name: Native conformance and documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TYPST_ARCHIVE_SHA256: 7d214bfeffc2e585dc422d1a09d2b144969421281e8c7f5d784b65fc69b5673f
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 python3-matplotlib rustc libgmp-dev libssl-dev curl xz-utils fonts-dejavu-core \
            libllvm16t64=1:16.0.6-23ubuntu4
          mkdir -p build/ci
          dpkg-query --show --showformat='${Package} ${Version}\n' \
            gcc g++ libc6 python3 python3-matplotlib rustc libgmp-dev libssl-dev libllvm16t64 \
            > build/ci/ubuntu-packages.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(['dpkg-query', '-L', 'libllvm16t64'], text=True).splitlines()
          libraries = [Path(p) for p in files if Path(p).name == 'libLLVM-16.so.1' and Path(p).is_file()]
          if len(libraries) != 1:
              raise SystemExit('Expected one packaged LLVM 16 shared library, found: ' + repr(libraries))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('DEC_LLVM_LIBRARY=' + str(libraries[0]) + '\n')
          PY
      - name: Verify recorded source hashes
        run: sha256sum -c SHA256SUMS
      - name: Verify imported source and evidence provenance
        run: python3 scripts/check_import_provenance.py
      - name: Run native and reference conformance
        run: python3 scripts/verify_native.py --output build/ci
      - name: Install pinned Typst 0.13.1
        run: |
          mkdir -p build/tools
          curl --fail --location --retry 3 --output build/tools/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          printf '%s  %s\n' "$TYPST_ARCHIVE_SHA256" build/tools/typst.tar.xz | sha256sum -c -
          tar -xJf build/tools/typst.tar.xz -C build/tools
          build/tools/typst-x86_64-unknown-linux-musl/typst --version
      - name: Build manual and verify published examples
        run: |
          python3 scripts/build_docs.py --native \
            --typst build/tools/typst-x86_64-unknown-linux-musl/typst \
            --output build/docs
      - name: Retain language and compiler manual
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: language-and-compiler-manual-${{ github.sha }}
          path: |
            build/docs/aod-dec-language-and-compiler.pdf
            build/docs/report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Run cell jitter study and native replay
        run: python3 scripts/simulate_cell_jitter.py --native --plots --output build/cell-jitter
      - name: Build computational application from fresh results
        run: |
          build/tools/typst-x86_64-unknown-linux-musl/typst compile --root . \
            --creation-timestamp 1794528000 \
            --input results=../build/cell-jitter/results.json \
            --input chart=../build/cell-jitter/accuracy-and-jitter.png \
            docs/tesseract-cell-jitter.typ build/cell-jitter/tesseract-cell-jitter.pdf
      - name: Retain cell jitter study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tesseract-cell-jitter-${{ github.sha }}
          path: |
            build/cell-jitter/results.json
            build/cell-jitter/*.pdf
            build/cell-jitter/*.png
            build/cell-jitter/dec/*.dec
          if-no-files-found: warn
          retention-days: 90
      - name: Run chiral encounter study and native replay
        run: python3 scripts/simulate_chiral_collision.py --native --plots --output build/chiral-collision
      - name: Build chiral application from fresh results
        run: |
          build/tools/typst-x86_64-unknown-linux-musl/typst compile --root . \
            --creation-timestamp 1794528000 \
            --input results=../build/chiral-collision/results.json \
            --input chart=../build/chiral-collision/chiral-study.png \
            docs/chiral-core-collision.typ build/chiral-collision/chiral-core-collision.pdf
      - name: Retain chiral encounter study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chiral-core-collision-${{ github.sha }}
          path: |
            build/chiral-collision/results.json
            build/chiral-collision/cohort.json
            build/chiral-collision/exemplars.json
            build/chiral-collision/chiral-study.png
            build/chiral-collision/chiral-core-collision.pdf
            build/chiral-collision/dec/*.dec
            build/chiral-collision/dec/*.stdout
            build/chiral-collision/dec/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-core-${{ github.sha }}
          path: |
            build/ci/*.log
            build/ci/*.json
            build/ci/*.txt
            build/ci/conformance/*.dec
            build/ci/conformance/*.json
            build/ci/conformance/cache/*.ll
          if-no-files-found: warn
          retention-days: 14
