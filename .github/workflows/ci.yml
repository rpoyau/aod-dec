name: AOD-DEC v2 CI

on:
  push:
    branches: ["main", "v2/native-reference-engine", "v2/zero-python-evolution"]
  pull_request:
    branches: ["main", "v2/native-reference-engine", "v2/zero-python-evolution"]

permissions:
  contents: read

jobs:
  rust-native-and-manual-verify:
    name: Rust Native Engine, Manual Fixtures, and 6-Pass Manual Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM 18 and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 libllvm18 clang

      - name: Build and test workspace (debug, offline, -D warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --workspace --offline
          cargo test --workspace --offline

      - name: Build and test workspace (release, offline, -D warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --workspace --release --offline
          cargo test --workspace --release --offline

      - name: Verify std-only Rust aodc dynamic-link isolation (ldd)
        run: |
          LDD_OUT="$(ldd ./target/release/aodc)"
          echo "$LDD_OUT"
          if echo "$LDD_OUT" | grep -qiE 'llvm|[p]ython|gmp'; then
            echo "ERROR: forbidden dynamic library dependency detected in aodc" >&2
            exit 1
          fi

      - name: Run Dec v1, v2 smoke, first_principles, and Manual fixture suites (unconditional PureWaveV2)
        run: |
          ./target/release/aodc test --compat v1 tests/fixtures/v1_examples
          ./target/release/aodc test tests/fixtures/v2_smoke
          ./target/release/aodc test examples/first_principles
          ./target/release/aodc test manual_examples
          ./target/release/aodc test --strict-wave tests/fixtures/v2_smoke/pure_wave_signature_matrix.dec
          for f in examples/first_principles/*.dec; do
            ./target/release/aodc fmt --check "$f"
          done

      - name: Run live hardware discovery & JIT micro-probes
        run: ./target/release/aodc probe-hw

      - name: Audit all 34 positive Dec v2 files via 6-hook native auditor (aodc audit-dec --json)
        run: |
          for f in examples/first_principles/*.dec stdlib/aod/*.dec manual_examples/*.dec tests/fixtures/v2_smoke/*.dec tests/fixtures/v2_bench/*.dec; do
            ./target/release/aodc audit-dec --json "$f"
          done

      - name: Verify live docs/manual/data/*.json parity via zero-LLVM Exact VM (aodc manual-data --check)
        run: |
          ./target/release/aodc manual-data --check
          ./target/release/aodc manual-data --check --json

      - name: Run 6-pass manual verifier (human + strict JSON)
        run: |
          ./target/release/aodc manual-verify docs/manual
          ./target/release/aodc manual-verify docs/manual --json

      - name: Verify 30/30 Stage 2 vectors, 90-tick S4@e013401 convergence, debug==release S4 report, and eval-op
        run: |
          ./target/release/aodc verify-s2
          ./target/release/aodc verify-s2 --json
          ./target/debug/aodc verify-s2 --s4-report --report /tmp/s4_report_debug.json
          ./target/release/aodc verify-s2 --s4-report --report /tmp/s4_report_release.json
          cmp /tmp/s4_report_debug.json /tmp/s4_report_release.json
          rm -f /tmp/s4_report_debug.json /tmp/s4_report_release.json
          ./target/release/aodc eval-op cycle_shedding_trace \
            --input-json '{"initial_burden":["1","2"],"eta":"0.82","gamma":"0.55","lambda_reclose":["19","50"],"ticks":[{"lead":"0.8","lag":["1","5"],"compatibility":"0.55"}]}'

      - name: Upload release aodc binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: aodc-release-bin
          path: target/release/aodc
          if-no-files-found: error

  typst-pdf-and-zero-raster-audit:
    name: Typst 0.15.1 Deterministic PDF Build and Pure-Rust Zero-Raster Audit
    needs: [rust-native-and-manual-verify]
    runs-on: ubuntu-24.04
    env:
      TYPST_VERSION: "0.15.1"
      TYPST_TARBALL: "typst-x86_64-unknown-linux-musl.tar.xz"
      TYPST_TARBALL_SHA256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release aodc binary artifact
        uses: actions/download-artifact@v4
        with:
          name: aodc-release-bin
          path: /tmp/aodc-bin

      - name: Install Latin Modern, DejaVu fonts, and poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-lmodern fonts-dejavu-core poppler-utils curl xz-utils

      - name: Install pinned SHA-256-verified Typst v0.15.1
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${TYPST_TARBALL}" -o "/tmp/${TYPST_TARBALL}"
          echo "${TYPST_TARBALL_SHA256}  /tmp/${TYPST_TARBALL}" | sha256sum -c -
          tar -xf "/tmp/${TYPST_TARBALL}" -C /tmp
          sudo install -m 755 "/tmp/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      - name: Double-build deterministic Typst PDF
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          typst compile --root . --creation-timestamp 0 docs/manual/main.typ /tmp/aod-dec-v2-manual-1.pdf
          typst compile --root . --creation-timestamp 0 docs/manual/main.typ /tmp/aod-dec-v2-manual-2.pdf

      - name: Audit compiled PDFs with pure-Rust aodc audit-pdf and pdfimages
        run: |
          chmod +x /tmp/aodc-bin/aodc
          /tmp/aodc-bin/aodc audit-pdf \
            --min-pages 6 \
            --compare-pdf /tmp/aod-dec-v2-manual-2.pdf \
            /tmp/aod-dec-v2-manual-1.pdf
          /tmp/aodc-bin/aodc audit-pdf \
            --min-pages 6 \
            --compare-pdf /tmp/aod-dec-v2-manual-2.pdf \
            --json \
            /tmp/aod-dec-v2-manual-1.pdf
          IMAGE_COUNT="$(pdfimages -list /tmp/aod-dec-v2-manual-1.pdf | tail -n +3 | wc -l)"
          echo "pdfimages embedded raster count: ${IMAGE_COUNT}"
          test "${IMAGE_COUNT}" -eq 0

      - name: Upload verified PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: aod-dec-v2-manual-pdf
          path: /tmp/aod-dec-v2-manual-1.pdf
          if-no-files-found: error

  aod-lint-strict:
    name: Strict rpoyau/aod-lint Check over docs/manual
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout aod-dec
        uses: actions/checkout@v4

      - name: Checkout rpoyau/aod-lint
        uses: actions/checkout@v4
        with:
          repository: rpoyau/aod-lint
          path: .ci-aod-lint
          token: ${{ secrets.AOD_LINT_TOKEN || github.token }}

      - name: Build aod-lint outside aod-dec workspace
        run: |
          rm -rf /tmp/aod-lint
          mv .ci-aod-lint /tmp/aod-lint
          cargo build --release --manifest-path /tmp/aod-lint/Cargo.toml

      - name: Run aod-lint check --strict over every Typst file in docs/manual
        run: |
          set -euo pipefail
          for f in $(find docs/manual -type f -name '*.typ' | sort); do
            echo "Linting $f"
            /tmp/aod-lint/target/release/aod-lint check --strict "$f"
          done
