name: Native conformance and documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TYPST_ARCHIVE_SHA256: 7d214bfeffc2e585dc422d1a09d2b144969421281e8c7f5d784b65fc69b5673f
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 python3-matplotlib rustc libgmp-dev libssl-dev curl xz-utils fonts-dejavu-core \
            libllvm16t64=1:16.0.6-23ubuntu4
          mkdir -p build/ci
          dpkg-query --show --showformat='${Package} ${Version}\n' \
            gcc g++ libc6 python3 python3-matplotlib rustc libgmp-dev libssl-dev libllvm16t64 \
            > build/ci/ubuntu-packages.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(['dpkg-query', '-L', 'libllvm16t64'], text=True).splitlines()
          libraries = [Path(p) for p in files if Path(p).name == 'libLLVM-16.so.1' and Path(p).is_file()]
          if len(libraries) != 1:
              raise SystemExit('Expected one packaged LLVM 16 shared library, found: ' + repr(libraries))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('DEC_LLVM_LIBRARY=' + str(libraries[0]) + '\n')
          PY
      - name: Verify recorded source hashes
        run: sha256sum -c SHA256SUMS
      - name: Verify imported source and evidence provenance
        run: python3 scripts/check_import_provenance.py
      - name: Run native and reference conformance
        run: python3 scripts/verify_native.py --output build/ci
      - name: Install pinned Typst 0.13.1
        run: |
          mkdir -p build/tools
          curl --fail --location --retry 3 --output build/tools/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          printf '%s  %s\n' "$TYPST_ARCHIVE_SHA256" build/tools/typst.tar.xz | sha256sum -c -
          tar -xJf build/tools/typst.tar.xz -C build/tools
          build/tools/typst-x86_64-unknown-linux-musl/typst --version
      - name: Build manual and verify published examples
        run: |
          python3 scripts/build_docs.py --native \
            --typst build/tools/typst-x86_64-unknown-linux-musl/typst \
            --output build/docs
      - name: Retain language and compiler manual
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: language-and-compiler-manual-${{ github.sha }}
          path: |
            build/docs/aod-dec-language-and-compiler.pdf
            build/docs/report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Run cell jitter study and native replay
        run: python3 scripts/simulate_cell_jitter.py --native --plots --output build/cell-jitter
      - name: Build computational application from fresh results
        run: |
          build/tools/typst-x86_64-unknown-linux-musl/typst compile --root . \
            --creation-timestamp 1794528000 \
            --input results=../build/cell-jitter/results.json \
            --input chart=../build/cell-jitter/accuracy-and-jitter.png \
            docs/tesseract-cell-jitter.typ build/cell-jitter/tesseract-cell-jitter.pdf
      - name: Retain cell jitter study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tesseract-cell-jitter-${{ github.sha }}
          path: |
            build/cell-jitter/results.json
            build/cell-jitter/*.pdf
            build/cell-jitter/*.png
            build/cell-jitter/dec/*.dec
          if-no-files-found: warn
          retention-days: 90
      - name: Run chiral encounter study and native replay
        run: python3 scripts/simulate_chiral_collision.py --native --plots --output build/chiral-collision
      - name: Build chiral application from fresh results
        run: |
          build/tools/typst-x86_64-unknown-linux-musl/typst compile --root . \
            --creation-timestamp 1794528000 \
            --input results=../build/chiral-collision/results.json \
            --input chart=../build/chiral-collision/chiral-study.png \
            docs/chiral-core-collision.typ build/chiral-collision/chiral-core-collision.pdf
      - name: Retain chiral encounter study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chiral-core-collision-${{ github.sha }}
          path: |
            build/chiral-collision/results.json
            build/chiral-collision/cohort.json
            build/chiral-collision/exemplars.json
            build/chiral-collision/chiral-study.png
            build/chiral-collision/chiral-core-collision.pdf
            build/chiral-collision/dec/*.dec
            build/chiral-collision/dec/*.stdout
            build/chiral-collision/dec/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Run routed tracing and parallel application study
        run: |
          python3 scripts/simulate_routing_parallel.py --output build/routing-parallel \
            --workers 2 --paths 256 --traced-paths 16 --gpu auto --plots
      - name: Build routed tracing application from fresh results
        run: |
          build/tools/typst-x86_64-unknown-linux-musl/typst compile --root . \
            --creation-timestamp 1794528000 \
            --input results=../build/routing-parallel/results.json \
            --input chart=../build/routing-parallel/routing-parallel.png \
            docs/routing-parallel.typ build/routing-parallel/routing-parallel.pdf
      - name: Retain routed tracing and parallel study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: routing-parallel-${{ github.sha }}
          path: |
            build/routing-parallel/results.json
            build/routing-parallel/*.json.gz
            build/routing-parallel/*.json
            build/routing-parallel/*.png
            build/routing-parallel/*.pdf
            build/routing-parallel/*.ptx
          if-no-files-found: warn
          retention-days: 90
      - name: Verify counted retained continuation
        run: python3 scripts/check_retained_continuation.py --output build/retained-continuation
      - name: Run scoped region and particle applications in both Python modes
        run: |
          mkdir -p build/scoped-current/normal build/scoped-current/optimized
          python3 -B simulations/run_regions.py --example all --output build/scoped-current/normal/regions.json
          python3 -B -O simulations/run_regions.py --example all --output build/scoped-current/optimized/regions.json
          cmp build/scoped-current/normal/regions.json build/scoped-current/optimized/regions.json
          python3 -B simulations/proton_accounting.py --output build/scoped-current/normal/proton-accounting.json
          python3 -B -O simulations/proton_accounting.py --output build/scoped-current/optimized/proton-accounting.json
          cmp build/scoped-current/normal/proton-accounting.json build/scoped-current/optimized/proton-accounting.json
          cmp build/scoped-current/normal/proton-accounting-witnesses.json.gz build/scoped-current/optimized/proton-accounting-witnesses.json.gz
          python3 -B simulations/electron_wire_accounting.py --output build/scoped-current/normal/electron-wire.json
          python3 -B -O simulations/electron_wire_accounting.py --output build/scoped-current/optimized/electron-wire.json
          cmp build/scoped-current/normal/electron-wire.json build/scoped-current/optimized/electron-wire.json
      - name: Execute region scalar formulas through reference, ORC and AOT
        run: |
          python3 -B scripts/check_region_current.py --output build/scoped-current/dec-normal
          python3 -B -O scripts/check_region_current.py --output build/scoped-current/dec-optimized
      - name: Build retained, boundary, particle and region companions
        run: make docs-scoped TYPST=build/tools/typst-x86_64-unknown-linux-musl/typst
      - name: Execute trace replay and finite boundary reduction
        run: make trace-example
      - name: Compile trace and profile companion
        run: make docs-trace TYPST=build/tools/typst-x86_64-unknown-linux-musl/typst
      - name: Retain scoped current studies and documentation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scoped-current-applications-${{ github.sha }}
          path: |
            build/scoped-current/normal/
            build/scoped-current/optimized/
            build/scoped-current/docs/
            build/scoped-current/dec-normal/results.json
            build/scoped-current/dec-optimized/results.json
            build/trace-profile/
            build/retained-continuation/*.json
            build/retained-continuation/*.json.gz
            build/retained-continuation/*.dec
            build/retained-continuation/*.stdout
            build/retained-continuation/*.pdf
          if-no-files-found: warn
          retention-days: 90
      - name: Reconstruct SPARC stellar inputs and compare the frozen cohort
        run: |
          python3 scripts/reconstruct_sparc.py --output build/sparc
          build/tools/typst-x86_64-unknown-linux-musl/typst compile --root . \
            --creation-timestamp 1794700800 \
            --input results=../build/sparc/results.json \
            docs/sparc-reconstruction.typ build/sparc/sparc-reconstruction.pdf
      - name: Retain SPARC reconstruction and inverse diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparc-reconstruction-${{ github.sha }}
          path: |
            build/sparc/results.json
            build/sparc/*.csv
            build/sparc/*.md
            build/sparc/*.pdf
          if-no-files-found: warn
          retention-days: 90
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-core-${{ github.sha }}
          path: |
            build/ci/*.log
            build/ci/*.json
            build/ci/*.txt
            build/ci/conformance/*.dec
            build/ci/conformance/*.json
            build/ci/conformance/cache/*.ll
          if-no-files-found: warn
          retention-days: 14

  sparc-reduced:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            flags: ''
          - mode: optimized
            flags: '-O'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TYPST_ARCHIVE_SHA256: 7d214bfeffc2e585dc422d1a09d2b144969421281e8c7f5d784b65fc69b5673f
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install reduced application prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3 python3-matplotlib curl xz-utils fonts-dejavu-core
          mkdir -p build/tools
          curl --fail --location --retry 3 --output build/tools/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          printf '%s  %s\n' "$TYPST_ARCHIVE_SHA256" build/tools/typst.tar.xz | sha256sum -c -
          tar -xJf build/tools/typst.tar.xz -C build/tools
      - name: Verify recorded source hashes
        run: sha256sum -c SHA256SUMS
      - name: Reopen and recompute the complete cohort and controls
        run: |
          python3 -B ${{ matrix.flags }} scripts/simulate_sparc_reduced.py --workers 2 \
            --replay evidence/sparc-reduced/trace.json.gz --output build/sparc-reduced
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          original = gzip.decompress(Path('evidence/sparc-reduced/trace.json.gz').read_bytes())
          fresh = gzip.decompress(Path('build/sparc-reduced/trace.json.gz').read_bytes())
          if original != fresh:
              raise SystemExit('Canonical trace bytes differ after decompression')
          PY
          cmp evidence/sparc-reduced/comparison.csv build/sparc-reduced/comparison.csv
      - name: Build reduced application documentation from fresh results
        run: |
          python3 scripts/plot_sparc_reduced.py --input build/sparc-reduced/comparison.csv \
            --output build/sparc-reduced/radial-comparison.png
          build/tools/typst-x86_64-unknown-linux-musl/typst compile --root . \
            --creation-timestamp 1794700800 \
            --input results=../build/sparc-reduced/summary.json \
            --input chart=../build/sparc-reduced/radial-comparison.png \
            docs/sparc-reduced.typ build/sparc-reduced/sparc-reduced.pdf
      - name: Retain complete reduced traces and comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparc-reduced-${{ matrix.mode }}-${{ github.sha }}
          path: build/sparc-reduced/
          if-no-files-found: warn
          retention-days: 90
